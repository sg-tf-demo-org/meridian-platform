[project]
name = "meridian-platform"
version = "2.14.0"
description = "Meridian commerce and operations platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "meridian-common @ file:packages/common",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0", "httpx>=0.27.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
