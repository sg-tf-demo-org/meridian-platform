services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: appointments
    ports: ["5432:5432"]
  checkout:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.service
    command: uvicorn services.checkout.src.main:app --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]
  risk_engine:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.service
    command: uvicorn services.risk_engine.src.main:app --host 0.0.0.0 --port 8082
    ports: ["8082:8082"]
